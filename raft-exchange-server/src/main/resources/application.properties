server.port=8080
spring.application.name=raft-exchange
eureka.client.serviceUrl.defaultZone=http://127.0.0.1:8761/eureka
eureka.client.registryFetchIntervalSeconds=5
eureka.client.instanceInfoReplicationIntervalSeconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${spring.cloud.client.ip-address}
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}
eureka.instance.status-page-url=http://${eureka.instance.ip-address}:${management.server.port}/info
eureka.instance.health-check-url=http://${eureka.instance.ip-address}:${management.server.port}/health

server.tomcat.threads.max=25
server.tomcat.threads.min-spare=25


raftexchange.kafka.spot.bootstrap.servers=localhost:9092,localhost:9092,localhost:9092
raftexchange.kafka.spot.topic=raftexchange-trade-event
raftexchange.kafka.perp.bootstrap.servers=localhost:9092,localhost:9092,localhost:9092
raftexchange.kafka.perp.topic=raftexchange-trade-event
raftexchange.kafka.delivery.bootstrap.servers=localhost:9092,localhost:9092,localhost:9092
raftexchange.kafka.delivery.topic=raftexchange-trade-event
raftexchange.kafka.fund.bootstrap.servers=localhost:9092,localhost:9092,localhost:9092
raftexchange.kafka.fund.topic=raftexchange-fund-event
raftexchange.kafka.other.bootstrap.servers=localhost:9092,localhost:9092,localhost:9092
raftexchange.kafka.other.topic=raftexchange-market-data

# Leader-only ApiNop heartbeat. 0=off (when MM is live). No-MM/local spot: 1000.
raftexchange.heartbeat.interval-ms=0

management.server.port=28081
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info,raft,metrics,prometheus

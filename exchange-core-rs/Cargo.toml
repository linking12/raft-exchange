# exchange-core Rust 移植 · 单 crate
# 设计文档: docs/superpowers/specs/2026-08-31-exchange-core-rust-port-design.md
# 参考骨架: https://github.com/llc-993/matching-core
[package]
name = "exchange-core-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
# 测试内省访问器(ExchangeApi::ups/ssp/risk/user_position/last_*)的门控开关。
# 经下方 self dev-dependency 在本 crate 自测时自动开启;外部依赖者默认不编译这些方法,故调用不到。
testing = []

[dependencies]
lz4_flex = "0.11"
# 日志门面（facade only，无 backend）：对引擎是纯副作用、不碰任何复制态，不影响确定性；
# 默认无 logger 时 trace!/debug! 宏短路、零开销。由上层 Raft server 决定是否装 backend 及输出级别。
log = "0.4"

[dev-dependencies]
proptest = "1"
# self dev-dependency:让 `cargo test`(含 tests/ 集成测试)自动带上 testing feature,从而看到内省访问器。
exchange-core-rs = { path = ".", features = ["testing"] }

# 纯引擎吞吐基准（绕开 Raft，直接灌 process_command）。自带 main（harness=false），零额外依赖，用 std::time 计时。
# 跑：cargo bench --bench engine_throughput
[[bench]]
name = "engine_throughput"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

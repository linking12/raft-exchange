# exchange-core Rust 移植 · 单 crate
# 设计文档: docs/superpowers/specs/2026-08-31-exchange-core-rust-port-design.md
# 参考骨架: https://github.com/llc-993/matching-core
[package]
name = "exchange-core-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"

# 纯引擎吞吐基准（绕开 Raft，直接灌 process_command）。自带 main（harness=false），零额外依赖，用 std::time 计时。
# 跑：cargo bench --bench engine_throughput
[[bench]]
name = "engine_throughput"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
